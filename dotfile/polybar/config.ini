; Polybar config — Nordic theme
; https://github.com/polybar/polybar/wiki

[colors]
background     = #2E3440
background-alt = #3B4252
foreground     = #ECEFF4
primary        = #88C0D0
secondary      = #81A1C1
alert          = #BF616A
disabled       = #667082

[bar/main]
width       = 100%
height      = 28pt
radius      = 0
offset-x    = 0
offset-y    = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size   = 3pt
border-size = 0

padding-left  = 1
padding-right = 1

module-margin = 1

separator            = " | "
separator-foreground = ${colors.disabled}

; SauceCodePro Nerd Font (installed by install-fonts.sh)
font-0 = SauceCodePro Nerd Font:size=10;2

modules-left   = i3 xwindow
modules-right  = pulseaudio cpu memory date

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; Override: no tray in VM (nm-applet uses it but no tray space needed)
; tray-position = right

[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent    = true
strip-wsnumbers = true
index-sort     = true
wrapping-scroll = false

label-focused            = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline  = ${colors.primary}
label-focused-padding    = 1

label-unfocused         = %name%
label-unfocused-padding = 1

label-visible            = %name%
label-visible-background = ${colors.background-alt}
label-visible-padding    = 1

label-urgent            = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding    = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix          = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume                 = <label-volume>
label-volume                  = %percentage%%

label-muted            = " muted"
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol

[module/cpu]
type     = internal/cpu
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.primary}
label                    = %percentage:2%%

[module/memory]
type     = internal/memory
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.primary}
label                    = %percentage_used:2%%

[module/date]
type     = internal/date
interval = 1

date     = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label            = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload  = true
pseudo-transparency  = true
